# =============================================================================
# Jekyll / GitHub Pages configuration for Image Retrieval arXiv Daily
# =============================================================================
# The site is built by GitHub Pages from the /docs folder ("Deploy from a
# branch"). `url` and `baseurl` are intentionally not set: GitHub Pages fills
# them in automatically (jekyll-github-metadata), and every link in the site is
# built relative to them, so the site works under any repository name.

title: Image Retrieval arXiv Daily
# Keep this sentence identical to `site.description` in ../config.yaml.
description: "Daily-updated arXiv papers on image retrieval and visual search, organized by research topic."
lang: en-US
author: Ezharjan
repository: Ezharjan/DailyImageretRievalArxiv

# Theme: Just the Docs (https://just-the-docs.com), pinned for reproducible builds.
remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: light

# The papers page has its own fast, paper-level search; the theme's full-text
# search would only index the documentation pages, so it is disabled.
search_enabled: false

heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"
favicon_ico: "/assets/images/favicon.ico"

aux_links:
  "GitHub":
    - "https://github.com/Ezharjan/DailyImageretRievalArxiv"
aux_links_new_tab: true

footer_content: >-
  &copy; 2025&ndash;2026 Ezharjan &middot; Paper metadata from
  <a href="https://arxiv.org/">arXiv</a>, updated daily with GitHub Actions &middot;
  <a href="https://github.com/Ezharjan/DailyImageretRievalArxiv/blob/HEAD/LICENSE">MIT License</a>

plugins:
  - jekyll-seo-tag
  - jekyll-github-metadata
  - jekyll-include-cache

# Note: a bare "vendor" entry would also exclude the theme's `vendor/compress`
# layout (which minifies the generated HTML), so only its subfolders are listed.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .bundle/
  - .jekyll-cache/
  - .sass-cache/
